[package]
name = "lldap_plugin_kv_store"
version = "0.1.0"
authors = ["Simon Broeng Jensen <sbj@cwconsult.dk>"]
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1"
thiserror = "1"

[dev-dependencies.log]
version = "*"

[dependencies.sea-orm]
workspace = true
default-features = false
features = [
    "macros",
    "with-chrono",
    "with-uuid",
    "sqlx-all",
    "runtime-actix-rustls",
]

[dependencies.serde]
workspace = true

[dependencies.tokio]
version = "*"
features = ["macros", "rt"]

[dependencies.lldap_domain]
path = "../domain"

[dependencies.lldap_domain_model]
path = "../domain-model"

[dependencies.lldap_key_value_store]
path = "../key-value-store"
features = ["seaorm"]
